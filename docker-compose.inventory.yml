services:
  inventory-svc:
    image: ${INVENTORY_IMAGE:?INVENTORY_IMAGE debe indicar la imagen con SHA}
    container_name: g6-inventory-svc
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INVENTORY_SVC_PORT: 3005
    ports:
      - '127.0.0.1:3005:3005'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
