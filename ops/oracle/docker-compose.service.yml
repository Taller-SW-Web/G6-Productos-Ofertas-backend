services:
  service:
    image: ${G6_SERVICE_IMAGE:?G6_SERVICE_IMAGE es obligatorio}
    container_name: ${G6_SERVICE_CONTAINER:?G6_SERVICE_CONTAINER es obligatorio}
    restart: unless-stopped
    env_file:
      - ${G6_SERVICE_ENV_FILE:?G6_SERVICE_ENV_FILE es obligatorio}
    environment:
      - NODE_ENV=production
      - PORT=${G6_SERVICE_PORT:?G6_SERVICE_PORT es obligatorio}
      - ${G6_SERVICE_PORT_ENV:?G6_SERVICE_PORT_ENV es obligatorio}=${G6_SERVICE_PORT:?G6_SERVICE_PORT es obligatorio}
    ports:
      - '127.0.0.1:${G6_SERVICE_PORT}:${G6_SERVICE_PORT}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${G6_SERVICE_PORT}/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
