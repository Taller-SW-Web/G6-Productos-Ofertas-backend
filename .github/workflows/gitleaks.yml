name: Gitleaks

on:
  workflow_call:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks 8.30.1 con SHA-256 verificado
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Probar detección negativa del escáner
        run: node --test scripts/ci/gitleaks-negative.test.mjs
      - name: Escanear cambios o historia completa sin divulgar secretos
        id: scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gitleaks-evidence"
          mkdir -p "$out"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
            mode=diff
          elif [[ "$GITHUB_EVENT_NAME" == push && "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
            mode=diff
          else
            mode=history
          fi
          set +e
          if [[ "$mode" == diff ]]; then
            git diff --no-ext-diff --binary "$base" HEAD | gitleaks stdin --no-banner --redact --exit-code 42 --report-format json --report-path "$out/findings.json"
          else
            gitleaks git --no-banner --redact --exit-code 42 --report-format json --report-path "$out/findings.json" .
          fi
          status=$?
          set -e
          printf '{"source_sha":"%s","mode":"%s","scanner_exit_code":%s}\n' "$GITHUB_SHA" "$mode" "$status" > "$out/decision.json"
          exit "$status"
      - name: Conservar evidencia redactada
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks-evidence/
          if-no-files-found: error
          retention-days: 30
