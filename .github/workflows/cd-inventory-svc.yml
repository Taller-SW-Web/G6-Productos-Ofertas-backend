name: CD inventory-svc Oracle

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-inventory-svc-oracle
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Build and publish inventory-svc image
    permissions:
      actions: read
      contents: read
      packages: write
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha: ${{ steps.image.outputs.sha }}
    steps:
      - name: Select successful master commit
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="$GITHUB_SHA"
            ci_success="$(gh run list --workflow ci.yml --branch master --commit "$sha" --json conclusion,event,headBranch --jq 'any(.[]; .conclusion == "success" and .event == "push" and .headBranch == "master")')"
            if [[ "$ci_success" != true ]]; then
              echo "No successful CI run was found for master commit $sha." >&2
              exit 1
            fi
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          current="$(gh api repos/${GITHUB_REPOSITORY}/commits/master --jq .sha)"
          if [[ "$sha" != "$current" ]]; then
            echo "Skipping obsolete commit $sha; master is $current."
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/inventory-svc:$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout selected commit
        if: steps.image.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.sha }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.sha != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.sha != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: steps.image.outputs.sha != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.inventory-svc
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=inventory-svc
          cache-to: type=gha,mode=max,scope=inventory-svc

  deploy:
    name: Deploy and verify on Oracle
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.sha != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_GHCR_USERNAME: ${{ secrets.ORACLE_GHCR_USERNAME }}
          ORACLE_GHCR_TOKEN: ${{ secrets.ORACLE_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS ORACLE_GHCR_USERNAME ORACLE_GHCR_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Secret $name is not configured; Oracle CD is not activated." >&2
              exit 1
            fi
          done

      - name: Confirm commit is still the master head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail
          current="$(gh api repos/${GITHUB_REPOSITORY}/commits/master --jq .sha)"
          if [[ "$IMAGE_SHA" != "$current" ]]; then
            echo "Skipping obsolete commit $IMAGE_SHA; master is now $current."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure verified SSH access
        if: steps.freshness.outputs.deploy == 'true'
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle_inventory
          chmod 600 ~/.ssh/oracle_inventory
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify restricted SSH authentication from GitHub Actions
        if: steps.freshness.outputs.deploy == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          set +e
          ssh -vv -i ~/.ssh/oracle_inventory -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ORACLE_USER@$ORACLE_HOST" "connectivity-probe" > /tmp/oracle-ssh.out 2> /tmp/oracle-ssh.err
          ssh_status=$?
          set -e
          cat /tmp/oracle-ssh.err >&2
          cat /tmp/oracle-ssh.out
          if [[ "$ssh_status" == 255 ]] || ! grep -q 'Authenticated to ' /tmp/oracle-ssh.err; then
            echo 'No se pudo autenticar por SSH desde GitHub Actions.' >&2
            exit 1
          fi
          if ! grep -q 'comando remoto no autorizado' /tmp/oracle-ssh.err /tmp/oracle-ssh.out; then
            echo 'La clave no llegó al comando forzado esperado; se detiene el despliegue.' >&2
            exit 1
          fi

      - name: Deploy image and verify health with rollback
        if: steps.freshness.outputs.deploy == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_GHCR_USERNAME: ${{ secrets.ORACLE_GHCR_USERNAME }}
          ORACLE_GHCR_TOKEN: ${{ secrets.ORACLE_GHCR_TOKEN }}
          IMAGE_SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$ORACLE_GHCR_USERNAME" "$ORACLE_GHCR_TOKEN" |
            ssh -i ~/.ssh/oracle_inventory -o BatchMode=yes -o IdentitiesOnly=yes \
              "$ORACLE_USER@$ORACLE_HOST" "inventory-deploy $IMAGE_SHA"
