        test "$(git -C .ci/G6-Productos-Ofertas-docs rev-parse HEAD:contratos/http/openapi.yaml)" = '6ff062c563d381d4bcf7976f223590b400ace4ec'
        node scripts/ci/check-taxonomy-contract.mjs .ci/G6-Productos-Ofertas-docs/contratos/http/openapi.yaml
    - name: Rechazar URL de base aportada antes de acceder a Docker
      run: node --test scripts/ci/run-taxonomy-integration.test.mjs
    - name: Ejecutar pruebas de integración Taxonomy (obligatorias)
      run: node scripts/ci/run-taxonomy-integration.mjs
