name: Integración continua (CI)
'on':
  push:
    branches: [master]
  pull_request:
    branches:
    - master
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Ejecutar CI normal o un benchmark focalizado
        required: true
        type: choice
        default: ci
        options: [ci, benchmark]
      component:
        description: Componente del benchmark
        required: false
        type: choice
        options: [catalog, pricing, combos, promotions, price-audit, bulk, inventory-gateway, taxonomy]
      baseline_sha:
        description: SHA completo de master u otra revisión base aprobada
        required: false
        type: string
      include_legacy_combos:
        description: Ejecuta además el benchmark histórico H4 de Combos con RabbitMQ
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark' }}
permissions:
  contents: read
jobs:
  automatizacion:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Validar flujos de automatización
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Validar flujos de automatización con actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
    - name: Configurar Node.js para las validaciones del workflow
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
    - name: Comprobar aislamiento del workflow de performance G6
      run: node scripts/ci/test-performance-workflow.mjs
    - name: Probar política Draft y Ready
      run: node --test scripts/ci/draft-ready-policy.test.mjs
    - name: Verificar modo preconstruido de Marketplace
      run: |
        bash -n scripts/ci/marketplace-docker.sh scripts/ci/tests/marketplace-prebuilt.test.sh
        bash scripts/ci/tests/marketplace-prebuilt.test.sh
  azure_cd_h5:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Probar el ejecutor de CD Azure H5 sin credenciales
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Probar procedencia, imágenes y ejecutor con simulaciones
      run: |
        set -Eeuo pipefail
        bash ops/azure/container-apps/tests/validate-source.test.sh
        bash ops/azure/container-apps/tests/deployment-targets.test.sh
        bash ops/azure/container-apps/tests/deploy.test.sh
        bash ops/azure/container-apps/tests/smoke.test.sh
        bash ops/azure/container-apps/tests/verify-environment-protection.test.sh
        bash ops/azure/container-apps/tests/reconcile-recovery.test.sh
        bash ops/azure/container-apps/tests/workflow.test.sh
        bash ops/shared/tests/ensure-ghcr-sha-image.test.sh
        bash ops/shared/tests/publish-only-workflow.test.sh
        bash scripts/ci/tests/marketplace-prebuilt.test.sh
        for file in ops/shared/build-service.sh ops/shared/validate-publish-only-source.sh ops/shared/ensure-ghcr-sha-image.sh ops/shared/tests/services-ci.test.sh ops/shared/tests/ensure-ghcr-sha-image.test.sh ops/shared/tests/publish-only-workflow.test.sh ops/azure/container-apps/validate-source.sh ops/azure/container-apps/resolve-deployment-target.sh ops/azure/container-apps/verify-environment-protection.sh ops/azure/container-apps/deploy.sh ops/azure/container-apps/reconcile-recovery.sh ops/azure/container-apps/smoke-service.sh ops/azure/container-apps/tests/validate-source.test.sh ops/azure/container-apps/tests/deployment-targets.test.sh ops/azure/container-apps/tests/verify-environment-protection.test.sh ops/azure/container-apps/tests/deploy.test.sh ops/azure/container-apps/tests/smoke.test.sh ops/azure/container-apps/tests/reconcile-recovery.test.sh ops/azure/container-apps/tests/workflow.test.sh; do bash -n "$file"; done
        shellcheck scripts/ci/marketplace-docker.sh scripts/ci/tests/marketplace-prebuilt.test.sh ops/shared/build-service.sh ops/shared/validate-publish-only-source.sh ops/shared/ensure-ghcr-sha-image.sh ops/shared/tests/services-ci.test.sh ops/shared/tests/ensure-ghcr-sha-image.test.sh ops/shared/tests/publish-only-workflow.test.sh ops/azure/container-apps/validate-source.sh ops/azure/container-apps/resolve-deployment-target.sh ops/azure/container-apps/verify-environment-protection.sh ops/azure/container-apps/deploy.sh ops/azure/container-apps/reconcile-recovery.sh ops/azure/container-apps/smoke-service.sh ops/azure/container-apps/tests/validate-source.test.sh ops/azure/container-apps/tests/deployment-targets.test.sh ops/azure/container-apps/tests/verify-environment-protection.test.sh ops/azure/container-apps/tests/deploy.test.sh ops/azure/container-apps/tests/smoke.test.sh ops/azure/container-apps/tests/reconcile-recovery.test.sh ops/azure/container-apps/tests/workflow.test.sh
    - name: Probar bindings JIT y planificación RBAC
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        ./ops/azure/github-runner-h5/tests/test-jit-runner-operations.ps1
        ./ops/azure/github-runner-h5/tests/test-rbac-plan.ps1
  tipos:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Comprobar tipos TypeScript
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Comprobar tipos TypeScript
      run: npm run typecheck
  calidad:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Revisar calidad del código
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Revisar calidad del código con Oxlint
      run: npm run lint
  formato:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Comprobar formato del código
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Comprobar el formato del código
      run: npm run format:check
  unitarias:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Ejecutar pruebas unitarias
      run: npm test
    - name: Verificar configuracion y despliegue del piloto Service Bus
      run: node --test ops/azure/service-bus/aca-pilot.test.mjs ops/azure/service-bus/validate-pilot.test.mjs ops/azure/container-apps/phase3-preflight.test.mjs ops/azure/container-apps/render-deployment.test.mjs
  e2e:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Ejecutar pruebas de extremo a extremo
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Ejecutar pruebas de extremo a extremo
      run: npm run test:e2e
  contratos:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Validar contratos y datos iniciales
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Instalar validador YAML fijado
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
    - name: Probar validadores documentales de Marketplace H4
      run: python -m unittest discover -s tests/docs -p "test_*.py" -v
    - name: Validar datos iniciales y resultados del agregador
      run: node --test scripts/seed/run.test.mjs scripts/seed/mcp/pricing/verify.test.mjs scripts/ci/verify-ci-results.test.mjs
  compilacion:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Compilar microservicios
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Compilar Catalog como verificación individual
      run: npm run build:catalog-svc
    - name: Compilar los nueve componentes
      run: npm run build:all
    - name: Comprobar los artefactos ejecutables compilados
      run: "for app in api-gateway bulk-svc catalog-svc combos-svc inventory-svc price-audit-svc pricing-svc promotions-svc\
        \ taxonomy-svc; do\n  if [ ! -f \"dist/apps/$app/main.js\" ]; then\n    echo \"FALLO: falta el artefacto dist/apps/$app/main.js\"\
        \n    exit 1\n  fi\ndone\necho \"Los nueve componentes tienen artefactos ejecutables válidos.\"\n"
  contenedores:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Validar imágenes y pruebas funcionales de contenedores
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Descargar las migraciones oficiales fijadas de Inventory
      uses: actions/checkout@v4
      with:
        repository: Taller-SW-Web/G6-Productos-Ofertas-docs
        ref: c36bd9a18f4fdb188df0d7e5158a431cf4b4ea7b
        path: .ci/G6-Productos-Ofertas-docs
        persist-credentials: 'false'
    - name: Configurar Node.js para las comprobaciones de arranque
      uses: actions/setup-node@v4
      with:
        node-version: '24.15.0'
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Validar el inventario neutral de nueve servicios
      run: bash ops/shared/tests/services-ci.test.sh
    - name: Construir la imagen independiente de Inventory
      run: docker build --file Dockerfile.inventory-svc --tag inventory-svc:ci .
    - name: Construir las imágenes de los nueve servicios
      run: |
        set -Eeuo pipefail
        while IFS='|' read -r service port port_env; do
          [[ -n "$service" && "$service" != \#* ]] || continue
          docker build --file Dockerfile.service --build-arg SERVICE_NAME="$service" --tag "g6-service:${service}-ci" .
        done < ops/shared/services-ci.psv
    - name: Probar salud y configuración de las nueve imágenes
      run: |
        set -Eeuo pipefail
        while IFS='|' read -r service port port_env; do
          [[ -n "$service" && "$service" != \#* ]] || continue
          if [[ "$service" == inventory-svc ]]; then
            printf 'INVENTORY: se valida con smoke funcional PostgreSQL/TLS aislado.\n'
            continue
          fi
          if [[ "$service" == catalog-svc || "$service" == taxonomy-svc ]]; then
            printf 'NO EJECUTADO en el bucle sin dependencias: %s requiere PostgreSQL runtime; marketplace-docker.sh ejerce ambos con PostgreSQL/TLS.\n' "$service"
            continue
          fi
          if [[ "$service" == promotions-svc ]]; then
            G6_PROMOTIONS_TEST_IMAGE="g6-service:${service}-ci" node apps/promotions-svc/test/container.smoke.mjs
            continue
          fi
          name="${service}-generic-ci"
          combos_ca_dir=''
          if [[ "$service" == api-gateway ]]; then
            docker run --rm --entrypoint node "g6-service:${service}-ci" -e \
              "require('node:fs').accessSync('/app/dist/apps/api-gateway/readiness.js')"
          fi
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true; if [[ -n "${combos_ca_dir:-}" ]]; then rm -f "$combos_ca_dir/ca.key" "$combos_ca_dir/ca.crt"; rmdir "$combos_ca_dir" 2>/dev/null || true; fi' EXIT
          runtime_env=()
          if [[ "$service" == pricing-svc ]]; then
            runtime_env+=(--env 'DATABASE_URL=postgresql://pricing:ci-fixture@127.0.0.1:1/pricing?sslmode=verify-full')
          fi
          if [[ "$service" == price-audit-svc ]]; then
            runtime_env+=(--env 'DATABASE_URL=postgresql://audit:ci-fixture@127.0.0.1:1/audit?sslmode=verify-full'
              --env 'AUTH_ISSUER=https://identity.invalid' --env 'AUTH_JWKS_URL=https://identity.invalid/jwks')
          fi
          if [[ "$service" == combos-svc ]]; then
            combos_ca_dir="$(mktemp -d)"
            combos_ca="$combos_ca_dir/ca.crt"
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$combos_ca_dir/ca.key" \
              -out "$combos_ca" -days 1 -subj '/CN=combos-ci-test-ca' \
              -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
            runtime_env+=(--env 'PGHOST=localhost' --env 'PGPORT=1' --env 'PGDATABASE=combos_ci' --env 'PGUSER=combos_ci'
              --env 'PGPASSWORD=ci-only-unused' --env 'PGSSLMODE=verify-full'
              --env 'PGSSLROOTCERT=/run/g6-ci-certs/ca.crt' --env 'G6_SECURITY_MODE=G7_AUTHENTICATED'
              --env 'SECURITY_ISSUER=https://identity.invalid'
              --env 'SECURITY_DISCOVERY_URL=https://identity.invalid/.well-known/openid-configuration'
              --env 'SECURITY_JWKS_URL=https://identity.invalid/jwks' --env 'COMBOS_RESTRICTED_DEMO_ENABLED=false'
              --mount "type=bind,source=$combos_ca,target=/run/g6-ci-certs/ca.crt,readonly")
          fi
          docker run --detach --name "$name" --publish "127.0.0.1::${port}" \
            --env "PORT=${port}" --env "${port_env}=${port}" "${runtime_env[@]}" "g6-service:${service}-ci" >/dev/null
          host_port="$(docker port "$name" "${port}/tcp" | awk -F: '{print $NF}')"
          response=''
          for attempt in {1..30}; do
            if response="$(curl --fail --silent "http://127.0.0.1:${host_port}/health")"; then break; fi
            sleep 2
          done
          if [[ -z "$response" ]]; then
            printf 'FALLO: %s no respondió /health con HTTP 200.\n' "$service" >&2
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}}' "$name" >&2
            exit 1
          fi
          node -e 'const payload=JSON.parse(process.argv[1]); if(payload.status!=="ok"||payload.service!==process.argv[2]) process.exit(1)' "$response" "$service"
          if [[ "$service" == pricing-svc || "$service" == price-audit-svc || "$service" == combos-svc ]]; then
            readiness_path=/health/ready
            [[ "$service" != combos-svc ]] || readiness_path=/ready
            readiness_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${host_port}${readiness_path}")"
            [[ "$readiness_status" == 503 ]]
          fi
          if [[ "$service" == combos-svc ]]; then
            if docker run --rm "g6-service:${service}-ci" >/dev/null 2>&1; then
              printf 'FALLO: combos-svc arrancó sin configuración PostgreSQL obligatoria.\n' >&2
              exit 1
            fi
          fi
          healthy=''
          for attempt in {1..30}; do
            healthy="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            [[ "$healthy" == healthy ]] && break
            sleep 2
          done
          [[ "$healthy" == healthy ]]
          docker rm --force "$name" >/dev/null
          if [[ -n "$combos_ca_dir" ]]; then rm -f "$combos_ca_dir/ca.key" "$combos_ca_dir/ca.crt"; rmdir "$combos_ca_dir"; fi
          trap - EXIT
          printf 'PASS: %s escuchó en %s/%s y su healthcheck quedó saludable.\n' "$service" "$port_env" "$port"
        done < ops/shared/services-ci.psv
    - name: Probar imagen de Inventory con PostgreSQL TLS desechable
      env:
        G6_DOCS_ROOT: ${{ github.workspace }}/.ci/G6-Productos-Ofertas-docs
        INVENTORY_TEST_IMAGE: g6-service:inventory-svc-ci
      run: |
        set -Eeuo pipefail
        for attempt in 1 2; do bash scripts/ci/inventory-container-smoke.sh; done
    - name: Probar imagen independiente de Inventory con PostgreSQL TLS desechable
      env:
        G6_DOCS_ROOT: ${{ github.workspace }}/.ci/G6-Productos-Ofertas-docs
        INVENTORY_TEST_IMAGE: inventory-svc:ci
      run: |
        set -Eeuo pipefail
        for attempt in 1 2; do bash scripts/ci/inventory-container-smoke.sh; done
    - name: Rechazar arranques sin configuración PostgreSQL
      run: node scripts/ci/invalid-startup.mjs
    - name: Probar Marketplace con PostgreSQL TLS desechable
      env:
        G6_MARKETPLACE_USE_PREBUILT: 'true'
      run: bash scripts/ci/marketplace-docker.sh
    needs:
    - compilacion
    timeout-minutes: 30
  taxonomia:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Probar integración de Taxonomy con PostgreSQL desechable
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código fuente
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
    - name: Instalar dependencias de forma reproducible
      run: npm ci
    - name: Obtener OpenAPI oficial fijado
      uses: actions/checkout@v4
      with:
        repository: Taller-SW-Web/G6-Productos-Ofertas-docs
        ref: 4d285c5ffb91611b60385e0fab5a7295c95e3ed6
        path: .ci/G6-Productos-Ofertas-docs
        persist-credentials: 'false'
    - name: Verificar correspondencia estructural de rutas Taxonomy
      run: |
        set -euo pipefail
        test "$(git -C .ci/G6-Productos-Ofertas-docs rev-parse HEAD)" = '4d285c5ffb91611b60385e0fab5a7295c95e3ed6'
        test "$(git -C .ci/G6-Productos-Ofertas-docs rev-parse HEAD:contratos/http/openapi.yaml)" = '6ff062c563d381d4bcf7976f223590b400ace4ec'
        node scripts/ci/check-taxonomy-contract.mjs .ci/G6-Productos-Ofertas-docs/contratos/http/openapi.yaml
    - name: Rechazar URL de base aportada antes de acceder a Docker
      run: node --test scripts/ci/run-taxonomy-integration.test.mjs
    - name: Ejecutar pruebas de integración Taxonomy (obligatorias)
      run: node scripts/ci/run-taxonomy-integration.mjs
  taxonomia_catalogo:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Probar E2E aislado Taxonomy y Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Obtener backend y su historia
      uses: actions/checkout@v4
      with:
        path: backend
        fetch-depth: 0
    - name: Obtener migraciones oficiales fijadas
      uses: actions/checkout@v4
      with:
        repository: Taller-SW-Web/G6-Productos-Ofertas-docs
        ref: e6a8ec28dad2d0eba8dc2f273ec9cc6891376df6
        path: G6-Productos-Ofertas-docs
        persist-credentials: 'false'
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - name: Instalar dependencias
      run: npm ci
    - name: Ejecutar E2E con PostgreSQL y RabbitMQ aislados
      run: |
        set -o pipefail
        node apps/taxonomy-svc/test/e2e-catalog/run.mjs 2>&1 | tee apps/taxonomy-svc/test/e2e-catalog/run.log
    - name: Verificar migraciones e idempotencia H5 Taxonomy-Catalog en PostgreSQL descartable
      run: |
        set -o pipefail
        node tests/h5/run-taxonomy-catalog-postgres.mjs ../G6-Productos-Ofertas-docs 2>&1 | tee apps/taxonomy-svc/test/e2e-catalog/h5-postgres.log
    - name: Conservar evidencia de la ejecución
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: taxonomy-catalog-e2e-${{ github.sha }}
        path: |
          backend/apps/taxonomy-svc/test/e2e-catalog/evidence-latest.json
          backend/apps/taxonomy-svc/test/e2e-catalog/run.log
          backend/apps/taxonomy-svc/test/e2e-catalog/h5-postgres.log
        if-no-files-found: warn
  inventario:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Probar integración de Inventory con PostgreSQL y RabbitMQ desechables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Obtener backend
      uses: actions/checkout@v4
      with:
        path: backend
    - name: Obtener contratos fijados de Inventory
      uses: actions/checkout@v4
      with:
        repository: Taller-SW-Web/G6-Productos-Ofertas-docs
        ref: c36bd9a18f4fdb188df0d7e5158a431cf4b4ea7b
        path: docs
        persist-credentials: 'false'
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - name: Instalar dependencias
      run: npm ci
    - name: Verificar backfill de lifecycle en PostgreSQL 17 descartable
