        COMBOS_TEST_EVIDENCE_DIR: apps/combos-svc/test/evidence-h5-ci
      run: bash apps/combos-svc/test/run-postgres-isolated.sh --mode postgres-only --test-file combos-postgres.e2e-spec.ts
    - name: Verificar evidencia por HEAD SHA sin omisiones silenciosas
      run: |
        node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const env = JSON.parse(readFileSync("apps/combos-svc/test/evidence-h5-ci/run-environment.json", "utf8"));
          if (
            env.result !== "PASS" ||
            env.mode !== "postgres-only" ||
            env.rabbitmqStarted !== false ||
            env.sha !== process.env.GITHUB_SHA ||
            !Number.isInteger(env.passed) ||
            env.passed < 1 ||
            env.failed !== 0 ||
            env.skipped !== 0
          ) {
            console.error("Evidencia H5 Combos inválida:", env);
            process.exit(1);
          }
          console.log(`PASS combos_postgres_h5: passed=${env.passed} sha=${env.sha}`);
        '
    - name: Conservar evidencia H5 PostgreSQL de Combos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: combos-postgres-h5-e2e-${{ github.sha }}
