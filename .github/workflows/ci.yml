name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Seed runner tests (no database credentials)
        run: node --test scripts/seed/run.test.mjs

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build individual representative application (catalog-svc)
        run: npm run build:catalog-svc

      - name: Build all applications
        run: npm run build:all

      - name: Verify compiled artifacts
        run: |
          for app in api-gateway bulk-svc catalog-svc combos-svc inventory-svc price-audit-svc pricing-svc promotions-svc taxonomy-svc; do
            if [ ! -f "dist/apps/$app/main.js" ]; then
              echo "Error: Missing artifact dist/apps/$app/main.js"
              exit 1
            fi
          done
          echo "All 9 applications have valid executable artifacts."

      - name: Build inventory-svc container image
        run: docker build --file Dockerfile.inventory-svc --tag inventory-svc:ci .

      - name: Simulate generic Oracle deployment, isolation and rollback
        run: bash ops/oracle/tests/deploy-g6-service.test.sh

      - name: Validate closed Oracle service registry
        run: |
          set -euo pipefail
          for file in ops/oracle/service-registry.sh ops/oracle/deploy-g6-service.sh ops/oracle/deploy-inventory-svc.sh ops/oracle/build-service.sh ops/oracle/tests/deploy-g6-service.test.sh ops/oracle/tests/deploy-inventory-svc.test.sh; do
            bash -n "$file"
          done
          enabled="$(bash -c 'source ops/oracle/service-registry.sh; g6_enabled_services_json')"
          test "$enabled" = '["inventory-svc"]'
          test "$(awk -F'|' '$1 !~ /^#/ && NF { count++ } END { print count+0 }' ops/oracle/services.psv)" = 9

      - name: Validate generic Oracle Compose template
        run: |
          set -euo pipefail
          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT
          export G6_SERVICE_IMAGE=ghcr.io/taller-sw-web/g6-productos-ofertas-backend/catalog-svc:0123456789012345678901234567890123456789
          export G6_SERVICE_CONTAINER=g6-catalog-svc
          export G6_SERVICE_PORT=3001
          export G6_SERVICE_ENV_FILE="$runtime_env"
          docker compose --file ops/oracle/docker-compose.service.yml config --quiet

      - name: Build generic inventory service image
        run: docker build --file Dockerfile.service --build-arg SERVICE_NAME=inventory-svc --tag g6-service:ci .

      - name: Smoke test generic inventory service image
        run: |
          set -euo pipefail
          trap 'docker rm --force inventory-svc-generic-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name inventory-svc-generic-ci --publish 127.0.0.1::3005 --env PORT=3005 g6-service:ci
          port="$(docker port inventory-svc-generic-ci 3005/tcp | awk -F: '{print $NF}')"
          response=''
          for attempt in {1..30}; do
            if response="$(curl --fail --silent "http://127.0.0.1:${port}/health")"; then
              break
            fi
            sleep 2
          done
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.status !== "ok" || payload.service !== "inventory-svc") {
              console.error("Unexpected generic inventory health payload:", payload);
              process.exit(1);
            }
            console.log("Generic image process health passed; no Oracle deployment was performed.");
          ' "$response"

      - name: Smoke test inventory-svc container health
        run: |
          set -euo pipefail
          trap 'docker rm --force inventory-svc-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name inventory-svc-ci --publish 127.0.0.1::3005 inventory-svc:ci
          port="$(docker port inventory-svc-ci 3005/tcp | awk -F: '{print $NF}')"
          response=''
          for attempt in {1..30}; do
            if response="$(curl --fail --silent "http://127.0.0.1:${port}/health")"; then
              break
            fi
            sleep 2
          done
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.status !== "ok" || payload.service !== "inventory-svc") {
              console.error("Unexpected inventory-svc health payload:", payload);
              process.exit(1);
            }
            console.log("inventory-svc process health passed; this does not verify Supabase readiness.");
          ' "$response"

      - name: Smoke test compiled executable
        run: |
          node dist/apps/catalog-svc/main.js &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          sleep 3
          RESPONSE=$(curl -s http://localhost:3001/health)
          echo "Health response: $RESPONSE"
          node -e "
            const res = JSON.parse(process.argv[1]);
            if (res.status !== 'ok' || res.service !== 'catalog-svc') {
              console.error('Smoke test failed invalid payload:', res);
              process.exit(1);
            }
            console.log('Smoke test passed successfully.');
          " "$RESPONSE"
          kill $PID 2>/dev/null || true
