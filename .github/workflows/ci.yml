name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build all applications
        run: npm run build:all

      - name: Verify compiled artifacts
        run: |
          for app in api-gateway bulk-svc catalog-svc combos-svc inventory-svc price-audit-svc pricing-svc promotions-svc taxonomy-svc; do
            if [ ! -f "dist/apps/$app/main.js" ]; then
              echo "Error: Missing artifact dist/apps/$app/main.js"
              exit 1
            fi
          done
          echo "All 9 applications have valid executable artifacts."
