  gateway_inventory_postgres:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'benchmark')
    name: Probar E2E Gateway → Inventory → PostgreSQL 17 (obligatorio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Obtener código del backend
